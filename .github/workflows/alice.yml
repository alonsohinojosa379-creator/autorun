name: Alice Madness Returns

# Pestaña Actions -> "Alice Madness Returns" -> Run workflow.
# Al terminar, el zip para la SD queda en "Artifacts" (alice-card).
# Solo necesita alice.patch en la raiz del repo (trae todo lo demas).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar el parche de Alice Madness Returns
        run: |
          cp alice.patch /tmp/alice.patch
          git config user.name "build"
          git config user.email "build@localhost"
          base=c889e4eb722ba6435e50500d9dde51f59781ce99
          git fetch --depth 1 origin "$base"
          git checkout --force "$base"
          git am /tmp/alice.patch
          git log -3 --oneline

      - name: Usar la imagen de compilacion vigente
        run: |
          # El autor del proyecto retira las etiquetas viejas de la imagen de
          # compilacion ("manifest unknown"); se toma la etiqueta actual del original.
          if git fetch --depth 1 https://github.com/autorunhq/autorun.git main &&
             git show FETCH_HEAD:horizon-wine/switch-dev.txt > /tmp/switch-dev.txt && [ -s /tmp/switch-dev.txt ]; then
            cp /tmp/switch-dev.txt horizon-wine/switch-dev.txt
          else
            echo "ghcr.io/autorunhq/switch-dev:2026.10.01" > horizon-wine/switch-dev.txt
          fi
          cat horizon-wine/switch-dev.txt

      - name: Descargar las DLL de Windows (horizon-dlls)
        run: git submodule update --init --depth 1 horizon-dlls

      - name: Arreglar la ruta del compilador de Windows
        run: |
          # Los scripts de empaquetado traen escrita la ruta de macOS; aqui es Linux ARM.
          tc="llvm-mingw-20260505-ucrt-ubuntu-22.04-$(uname -m)"
          sed -i "s/llvm-mingw-20260505-ucrt-macos-universal/$tc/g" horizon-wine/tools/package-autorun.py horizon-wine/tools/verify-package.py
          grep -n "llvm-mingw" horizon-wine/tools/package-autorun.py horizon-wine/tools/verify-package.py

      - name: Meter DXVK GPLAsync en el zip de la SD
        run: |
          # El runtime ya sabe usar dxvk-gplasync si esta instalado en
          # drive_c/dxvk-gplasync[64]/versions/<version>; el launcher lo baja,
          # aqui se deja puesto de fabrica y se activa con dxvk-source=gplasync.
          python3 - <<'PY'
          import hashlib, io, json, os, sys, tarfile, urllib.request

          API = "https://gitlab.com/api/v4/projects/43488626/releases?per_page=20"
          DLLS = {"d3d8.dll", "d3d9.dll", "d3d10.dll", "d3d10_1.dll", "d3d10core.dll", "d3d11.dll", "dxgi.dll"}
          base = "horizon-wine/games/alice/drive_c"

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "alice-build"}), timeout=120) as r:
                  return r.read()

          def key(v):
              main, _, rev = v.partition("-")
              return ([int(x) for x in main.split(".")], int(rev or 0))

          best = None
          for rel in json.loads(get(API)):
              tag = rel["tag_name"].lstrip("vV")
              try:
                  k = key(tag)
              except ValueError:
                  continue
              if k[0] < [2, 1]:
                  continue
              for link in rel.get("assets", {}).get("links", []):
                  if link["name"] == f"dxvk-gplasync-v{tag}.tar.gz":
                      if best is None or k > best[0]:
                          best = (k, tag, link["url"])
          if not best:
              sys.exit("No se encontro un release de dxvk-gplasync con el asset esperado")
          _, ver, url = best
          print("GPLAsync", ver, url)
          data = get(url)
          digest = hashlib.sha256(data).hexdigest()
          out = {"x32": f"{base}/dxvk-gplasync/versions/{ver}", "x64": f"{base}/dxvk-gplasync64/versions/{ver}"}
          for d in out.values():
              os.makedirs(d, exist_ok=True)
          count = {"x32": 0, "x64": 0}
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as t:
              for m in t.getmembers():
                  if not m.isreg():
                      continue
                  parts = m.name.split("/")
                  if len(parts) < 2 or parts[-1].lower() not in DLLS or parts[-2] not in out:
                      continue
                  blob = t.extractfile(m).read()
                  if blob[:2] != b"MZ":
                      sys.exit("DLL invalida: " + m.name)
                  with open(os.path.join(out[parts[-2]], parts[-1]), "wb") as f:
                      f.write(blob)
                  count[parts[-2]] += 1
          print(count)
          if not count["x32"] or not count["x64"]:
              sys.exit("Faltan DLL x32 o x64 en el archivo")
          for d in out.values():
              with open(os.path.join(d, "release.ini"), "w") as f:
                  f.write(f"version={ver}\nsource={url}\nsha256={digest}\n")
          cfg = f"{base}/Alice/Binaries/Win32/AliceMadnessReturns.wine-nx.txt"
          with open(cfg, "w") as f:
              f.write("cpu=fex\nd3d=dxvk\nFEX_TSOENABLED=0\nvsync=0\ndxvk-hud=fps\ndxvk-source=gplasync\n")
              f.write(f"dxvk-version={ver}\n")
          print(open(cfg).read())
          PY
          find horizon-wine/games/alice -type f | sort

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y bison make curl python3

      - name: Compilar
        run: |
          # Docker compila como root: la carpeta tiene que ser de root, o git
          # se niega a leer vendor/box64 ("dubious ownership").
          sudo chown -R root:root "$GITHUB_WORKSPACE"
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" sh horizon-wine/build-game.sh "alice"

      - name: Devolver la carpeta al usuario normal
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Subir el zip para la SD
        uses: actions/upload-artifact@v4
        with:
          name: alice-card
          path: horizon-wine/build-autorun/alice-card.zip
          compression-level: 0
          retention-days: 7

      - name: Subir registros si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            horizon-wine/build-*/**/*.log
            horizon-wine/build-*/config.log
          if-no-files-found: ignore
