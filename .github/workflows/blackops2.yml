name: Black Ops II

# Pestaña Actions -> "Black Ops II" -> Run workflow.
# Al terminar, el zip para la SD queda en "Artifacts" (blackops2-card).
# Solo necesita blackops2.patch en la raiz del repo (trae todo lo demas).
# Tambien deja "parche-direcciones-bajas": la entrada de Hekate que BO2 necesita.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar el parche de Black Ops II
        run: |
          cp blackops2.patch /tmp/blackops2.patch
          git config user.name "build"
          git config user.email "build@localhost"
          base=c889e4eb722ba6435e50500d9dde51f59781ce99
          git fetch --depth 1 origin "$base"
          git checkout --force "$base"
          git am /tmp/blackops2.patch
          git log -3 --oneline

      - name: Usar la imagen de compilacion vigente
        run: |
          # El autor del proyecto retira las etiquetas viejas de la imagen de
          # compilacion ("manifest unknown"); se toma la etiqueta actual del original.
          if git fetch --depth 1 https://github.com/autorunhq/autorun.git main &&
             git show FETCH_HEAD:horizon-wine/switch-dev.txt > /tmp/switch-dev.txt && [ -s /tmp/switch-dev.txt ]; then
            cp /tmp/switch-dev.txt horizon-wine/switch-dev.txt
          else
            echo "ghcr.io/autorunhq/switch-dev:2026.10.01" > horizon-wine/switch-dev.txt
          fi
          cat horizon-wine/switch-dev.txt

      - name: Descargar las DLL de Windows (horizon-dlls)
        run: git submodule update --init --depth 1 horizon-dlls

      - name: Arreglar la ruta del compilador de Windows
        run: |
          # Los scripts de empaquetado traen escrita la ruta de macOS; aqui es Linux ARM.
          tc="llvm-mingw-20260505-ucrt-ubuntu-22.04-$(uname -m)"
          sed -i "s/llvm-mingw-20260505-ucrt-macos-universal/$tc/g" horizon-wine/tools/package-autorun.py horizon-wine/tools/verify-package.py
          grep -n "llvm-mingw" horizon-wine/tools/package-autorun.py horizon-wine/tools/verify-package.py

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y bison make curl python3

      - name: Compilar
        run: |
          # Docker compila como root: la carpeta tiene que ser de root, o git
          # se niega a leer vendor/box64 ("dubious ownership").
          sudo chown -R root:root "$GITHUB_WORKSPACE"
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" sh horizon-wine/build-game.sh "blackops2"

      - name: Devolver la carpeta al usuario normal
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Armar el parche de direcciones bajas (no depende de tu Atmosphere)
        run: |
          # El build ya compila el Mesosphere y el loader con el parche de
          # direcciones bajas (Atmosphere 1.11.2). Aqui se juntan con el package3
          # oficial de 1.11.2 en una entrada propia de Hekate, que arranca ese
          # Atmosphere sin tocar el que tengas instalado: sirve con cualquier
          # version instalada, en firmware hasta 22.5.0.
          w=horizon-wine/toolchains/boot-payloads
          b=out/nintendo_nx_arm64_armv8a/release
          o=/tmp/lowva
          d="$o/bootloader/autorun-lowva"
          mkdir -p "$d" "$o/bootloader/ini"
          cp "$w/atmosphere/mesosphere/$b/mesosphere.bin" "$d/mesosphere.bin"
          cp "$w/atmosphere/stratosphere/loader/$b/loader.kip" "$d/autorun-loader.kip"
          unzip -p "$w/atmosphere-1.11.2.zip" atmosphere/package3 > "$d/package3"
          [ -s "$d/package3" ] && [ -s "$d/mesosphere.bin" ] && [ -s "$d/autorun-loader.kip" ]
          cp "$w/atmosphere/LICENSE" "$d/LICENSE.Atmosphere"
          printf '%s\r\n' \
            '[Autorun - direcciones bajas]' \
            'fss0=bootloader/autorun-lowva/package3' \
            'kip1=bootloader/autorun-lowva/autorun-loader.kip' \
            'kernel=bootloader/autorun-lowva/mesosphere.bin' \
            'emummcforce=1' > "$o/bootloader/ini/autorun-lowva.ini"
          printf '%s\r\n' \
            'Parche de direcciones bajas (Atmosphere 1.11.2 + Mesosphere de Autorun)' \
            '' \
            '1. Copia la carpeta bootloader a la raiz de la SD (se une con la tuya).' \
            '   No se edita hekate_ipl.ini ni se toca tu Atmosphere.' \
            '2. En Hekate: Launch -> More configs -> "Autorun - direcciones bajas".' \
            '   Arranca solo en emuMMC. Sirve en firmware hasta 22.5.0.' \
            '3. Abre el juego desde su icono del menu HOME.' \
            '' \
            'Para quitarlo: borra bootloader/autorun-lowva y bootloader/ini/autorun-lowva.ini.' > "$o/LEEME.txt"
          (cd "$o" && sha256sum bootloader/autorun-lowva/* && zip -qr /tmp/parche-direcciones-bajas.zip .)

      - name: Subir el parche de direcciones bajas
        uses: actions/upload-artifact@v4
        with:
          name: parche-direcciones-bajas
          path: /tmp/parche-direcciones-bajas.zip
          compression-level: 0
          retention-days: 7

      - name: Subir el zip para la SD
        uses: actions/upload-artifact@v4
        with:
          name: blackops2-card
          path: horizon-wine/build-autorun/blackops2-card.zip
          compression-level: 0
          retention-days: 7

      - name: Subir registros si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            horizon-wine/build-*/**/*.log
            horizon-wine/build-*/config.log
          if-no-files-found: ignore
